<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plevark - Juegos y Películas</title>

    <!-- ==================== FAVICON ==================== -->
    <link rel="icon" type="image/png" href="Favicon.png">

    <!-- ==================== META TAGS ==================== -->
    <meta property="og:title" content="Plevark - Juegos y Películas">
    <meta property="og:description" content="Explora el mejor catálogo de películas y juegos. Nuevos estrenos, etiquetas especiales y mucho más.">
    <meta property="og:image" content="https://i.ibb.co/BKd2BC9L/BKd2BC9L.png">
    <meta property="og:url" content="https://tu-sitio-web.com">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        /* ===== RESET & PALETA ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-image: url('https://wallpapers.com/images/hd/glossy-black-mig1ajt30o0nme9i.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #0a0a0a;
            color: #faffff;
            padding: 16px 16px 100px 16px;
            min-height: 100vh;
            animation: bodyFadeIn 0.8s ease;
        }

        @keyframes bodyFadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- HEADER CON TEMÁTICA PARAGUAYA --- */
        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            animation: fadeDown 0.8s ease;
            padding: 20px 0 10px;
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, #0033A0, #FFFFFF, #D52B1E) 1;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            margin-bottom: 2px;
            color: #faffff;
        }

        header p {
            font-size: 0.95rem;
            color: #d6dfe5;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border: none;
            transition: transform 0.3s ease;
        }

        .logo-icon img:hover {
            transform: scale(1.08) rotate(-5deg);
        }

        /* --- SEARCH --- */
        .search-container {
            width: 100%;
            max-width: 500px;
            margin: 10px auto 30px auto;
            position: relative;
            animation: fadeUp 1s ease;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background-color: rgba(20, 20, 20, 0.85);
            border: 1px solid #bac1c8;
            border-radius: 50px;
            color: #faffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 0 rgba(186, 193, 200, 0);
        }

        .search-container input::placeholder {
            color: #b3c7d6;
        }

        .search-container input:focus {
            border-color: #d0d7da;
            background-color: rgba(30, 30, 30, 0.9);
            box-shadow: 0 0 20px rgba(186, 193, 200, 0.2);
            transform: scale(1.02);
        }

        .search-container::before {
            content: "🔍";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
        }

        /* --- GRID ÚNICO --- */
        #main-grid {
            display: grid;
            gap: 25px;
            grid-template-columns: repeat(2, 1fr);
            padding-top: 20px;
        }

        @media (min-width: 768px) {
            #main-grid { grid-template-columns: repeat(4, 1fr); }
        }

        @media (min-width: 1024px) {
            #main-grid { grid-template-columns: repeat(6, 1fr); }
        }

        /* --- TARJETAS CON ANIMACIONES MEJORADAS --- */
        .card {
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(186, 193, 200, 0.15);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
            animation: cardFadeUp 0.8s ease forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.96);
            will-change: transform, opacity;
        }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.10s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.20s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.30s; }
        .card:nth-child(7) { animation-delay: 0.35s; }
        .card:nth-child(8) { animation-delay: 0.40s; }
        .card:nth-child(9) { animation-delay: 0.45s; }
        .card:nth-child(10) { animation-delay: 0.50s; }
        .card:nth-child(11) { animation-delay: 0.55s; }
        .card:nth-child(12) { animation-delay: 0.60s; }
        .card:nth-child(13) { animation-delay: 0.65s; }
        .card:nth-child(14) { animation-delay: 0.70s; }
        .card:nth-child(15) { animation-delay: 0.75s; }
        .card:nth-child(16) { animation-delay: 0.80s; }
        .card:nth-child(17) { animation-delay: 0.85s; }
        .card:nth-child(18) { animation-delay: 0.90s; }
        .card:nth-child(19) { animation-delay: 0.95s; }
        .card:nth-child(20) { animation-delay: 1.00s; }
        .card:nth-child(21) { animation-delay: 1.05s; }
        .card:nth-child(22) { animation-delay: 1.10s; }
        .card:nth-child(23) { animation-delay: 1.15s; }
        .card:nth-child(24) { animation-delay: 1.20s; }
        .card:nth-child(25) { animation-delay: 1.25s; }
        .card:nth-child(26) { animation-delay: 1.30s; }
        .card:nth-child(27) { animation-delay: 1.35s; }
        .card:nth-child(28) { animation-delay: 1.40s; }
        .card:nth-child(29) { animation-delay: 1.45s; }
        .card:nth-child(30) { animation-delay: 1.50s; }
        .card:nth-child(31) { animation-delay: 1.55s; }
        .card:nth-child(32) { animation-delay: 1.60s; }
        .card:nth-child(33) { animation-delay: 1.65s; }
        .card:nth-child(34) { animation-delay: 1.70s; }
        .card:nth-child(35) { animation-delay: 1.75s; }
        .card:nth-child(36) { animation-delay: 1.80s; }
        .card:nth-child(37) { animation-delay: 1.85s; }
        .card:nth-child(38) { animation-delay: 1.90s; }
        .card:nth-child(39) { animation-delay: 1.95s; }
        .card:nth-child(40) { animation-delay: 2.00s; }
        .card:nth-child(41) { animation-delay: 2.05s; }
        .card:nth-child(42) { animation-delay: 2.10s; }
        .card:nth-child(43) { animation-delay: 2.15s; }
        .card:nth-child(44) { animation-delay: 2.20s; }
        .card:nth-child(45) { animation-delay: 2.25s; }
        .card:nth-child(46) { animation-delay: 2.30s; }
        .card:nth-child(47) { animation-delay: 2.35s; }
        .card:nth-child(48) { animation-delay: 2.40s; }

        @keyframes cardFadeUp {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: #bac1c8;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(186, 193, 200, 0.1);
        }

        /* --- ESTRUCTURA DE LA IMAGEN Y TÍTULO SUPERPUESTO --- */
        .card-img-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: #111;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), filter 0.4s ease;
            will-change: transform;
        }

        .card:hover .card-img {
            transform: scale(1.08);
            filter: brightness(1.05);
        }

        .card-title-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 16px 12px 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            color: #faffff;
            font-weight: 600;
            font-size: 0.9rem;
            line-height: 1.2;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 1;
            transition: transform 0.3s ease, padding 0.3s ease;
        }

        .card:hover .card-title-overlay {
            transform: translateY(-3px);
            padding-bottom: 16px;
        }

        /* Badges */
        .card-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            z-index: 2;
            text-shadow: 0 0 5px currentColor;
            animation: pulseBadge 2.5s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.08); }
        }

        .badge-hot { background: #ff4757; color: #fff; box-shadow: 0 0 25px rgba(255, 71, 87, 0.5); }
        .badge-new { background: #2ed573; color: #fff; box-shadow: 0 0 25px rgba(46, 213, 115, 0.4); }

        /* ===== BARRA DE NAVEGACIÓN LIQUID GLASS (proporcionada por el usuario) ===== */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            padding: 6px;
            border-radius: 60px;
            display: flex;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            min-width: 280px;
            max-width: 90%;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            animation: fadeUp 1s ease;
        }

        .nav-btn {
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 14px;
            border-radius: 40px;
            color: #d6dfe5;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: inherit;
            position: relative;
        }

        .nav-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .nav-btn .label {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: capitalize;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            color: #faffff;
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active {
            background: rgba(208, 215, 218, 0.15);
            backdrop-filter: blur(4px);
            color: #faffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(186, 193, 200, 0.1);
            transform: translateY(-3px);
        }

        .nav-btn.active .label {
            color: #faffff;
        }

        /* Animación de entrada */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* --- MODAL MEJORADO (grises, negro, blanco) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            animation: modalIn 0.5s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #aaaaaa;
            transition: all 0.3s ease;
            background: none;
            border: none;
            line-height: 1;
            z-index: 10;
        }

        .modal-close:hover {
            color: #ffffff;
            transform: rotate(90deg) scale(1.2);
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 5px;
            margin-bottom: 15px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.05);
            text-align: center;
            letter-spacing: -0.5px;
        }

        .modal-img {
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            margin-bottom: 20px;
            object-fit: contain;
            max-height: 45vh;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .modal-desc {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 20px;
            line-height: 1.6;
            max-width: 600px;
            text-align: center;
        }

        .modal-reqs {
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: pre-wrap;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .modal-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            max-width: 600px;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
            padding-bottom: 10px;
        }

        .modal-link-btn {
            flex: 1;
            min-width: 120px;
            max-width: 280px;
            text-align: center;
            padding: 14px 20px;
            background: #333333;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-link-btn:hover {
            background: #444444;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.15);
        }

        .modal-link-btn.primary {
            background: #d0d7da;
            color: #1a1a1a;
        }

        .modal-link-btn.primary:hover {
            background: #e7eaeb;
        }

        /* --- FORMULARIO DE PETICIONES --- */
        #requests-container {
            display: none;
            margin: 20px auto;
            max-width: 500px;
            padding: 24px;
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(186, 193, 200, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: fadeUp 0.4s ease;
        }

        #requests-container.active { display: block; }
        #requests-container h3 { color: #faffff; margin-bottom: 15px; font-weight: 400; letter-spacing: 1px; }
        #requests-container textarea {
            width: 100%; padding: 14px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(186, 193, 200, 0.3); border-radius: 12px;
            color: #faffff; font-size: 1rem; resize: vertical; min-height: 100px;
            transition: border-color 0.3s; font-family: inherit;
        }
        #requests-container textarea:focus {
            outline: none; border-color: #bac1c8; background: rgba(255, 255, 255, 0.08);
        }
        #requests-container textarea::placeholder { color: #b3c7d6; }
        #requests-container .submit-btn {
            margin-top: 12px; width: 100%; padding: 12px; background: #d0d7da;
            border: none; border-radius: 12px; color: #1a1a1a; font-weight: 700;
            font-size: 1rem; cursor: pointer; transition: all 0.3s ease;
        }
        #requests-container .submit-btn:hover {
            background: #e7eaeb; transform: scale(1.03);
        }
        #request-status { margin-top: 10px; font-size: 0.9rem; color: #d6dfe5; text-align: center; }

        /* --- FOOTER CON TEMÁTICA PARAGUAYA --- */
        .footer {
            text-align: center; margin-top: 50px; padding: 20px;
            color: #b3c7d6; font-size: 0.9rem; letter-spacing: 0.5px;
            border-top: 2px solid transparent;
            border-image: linear-gradient(90deg, #0033A0, #FFFFFF, #D52B1E) 1;
            animation: fadeUp 1s ease;
        }

        @media (max-width: 480px) {
            .bottom-nav { padding: 4px; min-width: 200px; gap: 2px; bottom: 12px; }
            .nav-btn { padding: 4px 8px; }
            .nav-btn svg { width: 18px; height: 18px; }
            .nav-btn .label { font-size: 7px; }
            .modal-title { font-size: 1.4rem; }
            .modal-img { max-height: 35vh; }
            .modal-link-btn { font-size: 0.9rem; padding: 10px; min-width: 100px; }
            .logo-icon { width: 55px; height: 55px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="header-title">Plevark</h1>
            <p id="header-sub">Juegos y Películas</p>
            <div class="logo-icon">
                <img src="https://i.postimg.cc/kGgGG4pw/Screenshot-20260704-210256-removebg-preview.png" alt="Logo Plevark">
            </div>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar películas o juegos...">
        </div>

        <div id="main-grid" class="grid-main"></div>

        <div id="requests-container">
            <h3 id="request-title">📌 Petición de contenido</h3>
            <textarea id="requestText" placeholder="Escribe aquí tu petición (película o juego)..."></textarea>
            <button class="submit-btn" id="sendRequestBtn">Enviar petición</button>
            <div id="request-status"></div>
        </div>

        <div class="footer">
            ©Plevark 2026 For you
        </div>
    </div>

    <!-- ===== BARRA DE NAVEGACIÓN LIQUID GLASS (estructura proporcionada) ===== -->
    <div class="bottom-nav">
        <!-- Botón 1: Todo -->
        <button class="nav-btn active" data-filter="all">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            </svg>
            <span class="label">Todo</span>
        </button>

        <!-- Botón 2: Juegos -->
        <button class="nav-btn" data-filter="games">
            <svg viewBox="0 0 24 24">
                <path d="M6 12h4v4H6z"></path>
                <path d="M14 12h4v4h-4z"></path>
                <path d="M8 8h8v4H8z"></path>
                <path d="M4 16h16v2H4z"></path>
                <circle cx="18" cy="10" r="1"></circle>
                <circle cx="6" cy="10" r="1"></circle>
                <path d="M12 12v-4"></path>
            </svg>
            <span class="label">Juegos</span>
        </button>

        <!-- Botón 3: Películas -->
        <button class="nav-btn" data-filter="movies">
            <svg viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="M8 4v16"></path>
                <path d="M16 4v16"></path>
                <path d="M8 8h8"></path>
                <path d="M8 12h8"></path>
                <path d="M8 16h8"></path>
            </svg>
            <span class="label">películas</span>
        </button>

        <!-- Botón 4: APP -->
        <button class="nav-btn" data-filter="app">
            <svg viewBox="0 0 24 24">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            <span class="label">APP</span>

        // ==================== RENDERIZADO ====================

        function renderContent() {
            const container = document.getElementById('main-grid');
            container.innerHTML = '';

            let allItems = [];
            movies.forEach(item => { allItems.push({ ...item, type: 'movie' }); });
            fromSeasons.forEach(season => {
                const item = {
                    title: season.title,
                    poster: season.poster,
                    screen: 'https://hips.hearstapps.com/hmg-prod/images/from-temporada-2-649ec0a7cb33a.jpg?crop=1xw:0.845427435387674xh;center,top&resize=1200:*',
                    links: season.links,
                    desc: season.desc,
                    reqs: season.reqs,
                    type: 'movie'
                };
                allItems.push(item);
            });
            games.forEach(item => { allItems.push({ ...item, type: 'game' }); });

            // Nueva prioridad: New (100) > Hot (25) > Resto (0)
            allItems.sort((a, b) => {
                const getWeight = (item) => {
                    if (item.showNewBadge) return 100;
                    if (item.id === 'p5') return 25;
                    return 0;
                };
                return getWeight(b) - getWeight(a);
            });

            allItems.forEach(item => {
                const link = item.type === 'game' ? (item.link || '#') : (item.links ? (item.links.mex || item.links.usa || '#') : '#');
                const card = createCard(item, item.type, link);
                container.appendChild(card);
            });

            filterCards();
        }

        function createCard(item, type, baseLink) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.type = type;
            card.dataset.search = (item.title || '').toLowerCase();

            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'card-img-wrapper';

            const img = document.createElement('img');
            img.className = 'card-img';
            img.src = item.poster || item.screen || 'https://via.placeholder.com/300x400?text=Sin+Poster';
            img.alt = item.title;
            img.loading = 'lazy';
            imgWrapper.appendChild(img);

            if (item.id === 'p5') {
                const badge = document.createElement('div');
                badge.className = 'card-badge badge-hot';
                badge.textContent = 'Hot';
                imgWrapper.appendChild(badge);
            } else if (item.showNewBadge) {
                const badge = document.createElement('div');
                badge.className = 'card-badge badge-new';
                badge.textContent = 'New';
                imgWrapper.appendChild(badge);
            }

            const titleOverlay = document.createElement('div');
            titleOverlay.className = 'card-title-overlay';
            titleOverlay.textContent = item.title;
            imgWrapper.appendChild(titleOverlay);

            card.appendChild(imgWrapper);

            card.addEventListener('click', function() { openModal(item, type); });

            return card;
        }

        function openModal(item, type) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            const img = document.getElementById('modalImg');
            const desc = document.getElementById('modalDesc');
            const reqs = document.getElementById('modalReqs');
            const links = document.getElementById('modalLinks');

            if (!modal || !title || !img || !desc || !reqs || !links) { return; }

            title.textContent = item.title;
            img.src = item.screen || item.poster || 'https://via.placeholder.com/300x400?text=Sin+Captura';
            img.alt = item.title;

            desc.textContent = item.desc || 'Descripción no disponible.';

            if (item.reqs && item.reqs.length > 0) { reqs.textContent = item.reqs.join(' • '); }
            else { reqs.textContent = 'No hay requisitos específicos.'; }

            links.innerHTML = '';

            if (type === 'game') {
                if (item.link && item.link !== '#') {
                    const btn = document.createElement('a');
                    btn.className = 'modal-link-btn primary';
                    btn.href = item.link;
                    btn.target = '_blank';
                    btn.textContent = 'Descargar APK';
                    btn.onclick = function(e) { notifyDownload(item, type); };
                    links.appendChild(btn);
                } else { links.innerHTML = `<p style="color:#888;">Enlace no disponible</p>`; }
            } else {
                if (item.links) {
                    if (item.links.mex && item.links.mex !== 'No disponible en español') {
                        const btnMex = document.createElement('a');
                        btnMex.className = 'modal-link-btn';
                        btnMex.href = item.links.mex;
                        btnMex.target = '_blank';
                        btnMex.textContent = 'Ver en Latino';
                        btnMex.onclick = function(e) { notifyDownload(item, type); };
                        links.appendChild(btnMex);
                    }
                    if (item.links.usa && !item.noEnglish) {
                        const btnUsa = document.createElement('a');
                        btnUsa.className = 'modal-link-btn';
                        btnUsa.href = item.links.usa;
                        btnUsa.target = '_blank';
                        btnUsa.textContent = 'Ver en Inglés';
                        btnUsa.onclick = function(e) { notifyDownload(item, type); };
                        links.appendChild(btnUsa);
                    }
                    if (!item.links.mex && !item.links.usa) { links.innerHTML = `<p style="color:#888;">Enlace no disponible</p>`; }
                } else { links.innerHTML = `<p style="color:#888;">Enlace no disponible</p>`; }
            }

            modal.style.display = 'flex';
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ==================== FILTROS Y BÚSQUEDA ====================

        function filterCards() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const activeFilter = document.querySelector('.nav-btn.active');
            let category = activeFilter ? activeFilter.dataset.filter : 'all';

            const allCards = document.querySelectorAll('.card');
            allCards.forEach(card => {
                let visible = true;
                const title = (card.dataset.search || '');
                if (searchTerm && !title.includes(searchTerm)) { visible = false; }
                if (visible && category !== 'all') {
                    if (category === 'movies' && card.dataset.type !== 'movie') visible = false;
                    if (category === 'games' && card.dataset.type !== 'game') visible = false;
                    if (category === 'requests') visible = false;
                }
                card.style.display = visible ? 'flex' : 'none';
            });

            if (category === 'requests') {
                document.getElementById('main-grid').style.display = 'none';
                document.getElementById('requests-container').classList.add('active');
            } else {
                document.getElementById('main-grid').style.display = 'grid';
                document.getElementById('requests-container').classList.remove('active');
            }
        }

        document.getElementById('searchInput').addEventListener('input', filterCards);

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const filter = this.dataset.filter;

                if (filter === 'app') {
                    window.open('https://apk.e-droid.net/apk/app4077278-ne4cwy.apk?v=6', '_blank');
                    return;
                }

                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                filterCards();
            });
        });

        // ==================== PETICIONES ====================

        document.getElementById('sendRequestBtn').addEventListener('click', function() {
            const text = document.getElementById('requestText').value.trim();
            const status = document.getElementById('request-status');
            if (!text) {
                status.textContent = '❌ Escribe algo antes de enviar.';
                status.style.color = '#bac1c8';
                return;
            }

            const embed = {
                title: "📩 Nueva Petición",
                color: 0xd0d7da,
                fields: [
                    { name: "👤 Usuario", value: "Anónimo", inline: true },
                    { name: "📝 Contenido", value: text, inline: false }
                ],
                footer: { text: "Plevark • Petición recibida" }
            };

            sendWebhookBackground(WEBHOOK_REQUESTS, { embeds: [embed] });
            status.textContent = '✅ Petición enviada con éxito.';
            status.style.color = '#faffff';
            document.getElementById('requestText').value = '';
            setTimeout(() => { status.textContent = ''; }, 4000);
        });

        // ==================== MODAL CLOSE ====================

        document.getElementById('modalClose').addEventListener('click', function() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            modal.style.display = 'none';
            document.body.style.overflow = '';
        });

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                this.style.display = 'none';
                document.body.style.overflow = '';
            }
        });

        // ==================== INICIALIZACIÓN ====================

        document.addEventListener('DOMContentLoaded', function() {
            renderContent();
            filterCards();
        });

        // Restaurar scroll
        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('scrollPosition', window.scrollY);
        });

        window.addEventListener('load', () => {
            const scrollPos = sessionStorage.getItem('scrollPosition');
            if (scrollPos) {
                window.scrollTo(0, parseInt(scrollPos));
                sessionStorage.removeItem('scrollPosition');
            }
        });
    </script>
</body>
</html>
